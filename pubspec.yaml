name: rivanshh_super_app
description: "Rivanshh All-in-One Super App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management & Icons
  provider: ^6.1.1
  flutter_lucide: ^0.1.3
  google_fonts: ^6.1.0

  # Audio & Background Playback
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.12

  # Media & WebView (Tube, Social & Web apps)
  youtube_player_flutter: ^8.1.2
  webview_flutter: ^4.4.2
  http: ^1.2.0

  # Storage & Utilities
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
